# cargo deny check (rust/check.sh): advisories, the license allowlist, duplicate versions, crate sources.

[graph]
all-features = true

[advisories]
# Every advisory is an error unless listed here with a reason.
ignore = []

[licenses]
# File-level allowlist. Each license names the crate that first brought it in, or `unused` until one does.
allow = [
	"MIT", # pi-* crates (workspace license), anyhow, serde_json
	"Apache-2.0", # ryu (Apache-2.0 OR BSL-1.0)
	"Apache-2.0 WITH LLVM-exception", # unused
	"BSD-2-Clause", # unused
	"BSD-3-Clause", # unused
	"ISC", # unused
	"Zlib", # foldhash (via serde_json preserve_order)
	"Unicode-3.0", # unicode-ident (via thiserror-impl)
	"MPL-2.0", # unused
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
